name: Rust checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xtask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # rust-toolchain.toml decides the toolchain, per AGENTS.md: Scripts. CI must not
      # float a version the repository didn't choose, so rustup installs that one.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Pin each tool to a release that was at least two weeks old when picked. The steps
      # below call the justfile's recipes, never cargo, because it holds every entry point.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.58.0,cargo-nextest@0.9.146

      - name: Check Rust formatting
        run: just fmt-check

      - name: Lint the xtask crate
        run: just clippy

      - name: Test the xtask crate
        run: just test

      - name: Verify resource metadata
        run: just validate-metadata

      - name: Verify the roster and the sources cited against it
        run: just validate-sources

      - name: Verify README indexes every opinion and skill
        run: just validate-readme-index

      - name: Verify template dependency and lint keys are sorted
        run: just validate-template-order

      # The README shows the committed SVGs, so they can drift from the code that draws
      # them. Redraw every diagram, and fail on any difference, including one never committed.
      - name: Verify the diagrams match the code that draws them
        run: just check-diagrams

      - name: Stage the site
        run: just build-site

name: Validate skills

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The other checks in dotnet's workflow of the same name run in the Rust checks workflow,
# through cargo xtask. This one needs Python, not a Rust toolchain, so it has its own job.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Nothing here pushes, so the job token stays out of .git/config, where a dependency's
        # install script could read it.
        with:
          persist-credentials: false

      # Pinned to a release at least two weeks old when chosen. The justfile is every entry
      # point, so the steps below call its recipes, never agentskills directly.
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just@1.58.0

      # Python only for skills-ref: the Agent Skills specification's own reference
      # validator, published only to PyPI.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install skills-ref
        run: pip install -r .github/requirements.txt

      - name: Validate skills against the Agent Skills spec
        run: just validate-skills

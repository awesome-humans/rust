name: Validate skills

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The other checks in dotnet's workflow of the same name run in the Rust checks workflow,
# through cargo xtask. This one needs Python, not a Rust toolchain, so it has its own job.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Pin just to a release that was at least two weeks old when picked. The steps below
      # call its recipes, never agentskills directly, because the justfile holds every entry
      # point.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.58.0

      # Python only for skills-ref: the Agent Skills specification's own reference
      # validator, published only to PyPI.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install skills-ref
        run: pip install -r .github/requirements.txt

      - name: Validate skills against the Agent Skills spec
        run: just validate-skills

name: Site preview

# Builds the whole awesome-humans.net site with this pull request's head commit as the
# /rust/ section and every other ecosystem at main, and deploys it as a preview at its
# own URL. awesome-humans/website owns the build and the deploy; this repository only
# stages its pages, as AGENTS.md: Site describes. A pull request from a fork builds
# without deploying, because it gets no secrets.
# The preview builds /rust/ even while rust is soon in website's ecosystems.toml.
on:
  pull_request:

permissions:
  contents: read

# A newer push to the pull request replaces a queued preview.
concurrency:
  group: site-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: awesome-humans/website/.github/workflows/build.yml@c30dd2126bb52f5caaf0f9ef30d859b035728ab5 # feat/preview-soon-ecosystems
    with:
      ecosystem: rust
      ref: ${{ github.event.pull_request.head.sha }}

  deploy:
    needs: build
    uses: awesome-humans/website/.github/workflows/deploy.yml@c30dd2126bb52f5caaf0f9ef30d859b035728ab5 # feat/preview-soon-ecosystems
    with:
      preview-alias: pr-rust-${{ github.event.pull_request.number }}
    secrets: inherit

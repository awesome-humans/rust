# awesome-humans/rust template | targets: rust-1.99, edition-2024 | last-reviewed: 2026-10-19 | sources: rust-docs
# An editor that runs bare rustfmt doesn't read the edition from Cargo.toml, and defaults to
# 2015 for both settings. Without `edition`, it can't parse a let chain (opinions/rust.md).
edition = "2024"
style_edition = "2024"

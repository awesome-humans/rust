# The repository's own Cargo workspace, which holds only the xtask crate of CI checks
# (AGENTS.md: Scripts). templates/ is content with a workspace of its own, built by
# `just verify`, so it stays out of this one.
[workspace]
members = ["xtask"]
exclude = ["templates"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
